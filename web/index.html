<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>triz.wf — TRIZ-решатель на базе ИИ</title>
    <meta name="description" content="Анти-компромиссный R&D-решатель: ТРИЗ, патентные графы и LLM." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="/">triz<span>.wf</span></a>
      <div class="telemetry" aria-hidden="true">
        <div class="metric">
          <span class="metric-label">CONTRADICTION</span>
          <span class="bars" data-bars="3,5,2,4,5,3,4"></span>
        </div>
        <div class="metric">
          <span class="metric-label">ANALOGS</span>
          <span class="bars" data-bars="2,4,5,4,3,5,4"></span>
        </div>
        <div class="metric">
          <span class="metric-label">CRITIC</span>
          <span class="sparkline" id="header-spark"></span>
        </div>
      </div>
    </header>

    <main class="app" aria-live="polite">
      <div id="app"></div>

      <details class="reference" open>
        <summary>40 ИЗОБРЕТАТЕЛЬСКИХ ПРИНЦИПОВ</summary>
        <div id="principles-grid" class="principles-grid"></div>
      </details>
    </main>

    <aside class="rail" aria-hidden="true">
      <div class="rail-title">CONTRADICTION MATRIX</div>
      <div class="matrix" id="matrix"></div>
      <div class="rail-title">SIGNAL</div>
      <div class="sparkline wide" id="rail-spark"></div>
    </aside>

    <footer class="site-footer">
      <div class="ticker" id="ticker"></div>
    </footer>

    <noscript><p class="noscript">Для работы мастера включите JavaScript.</p></noscript>
    <script src="/dashboard.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
